<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>登录 - 健身房管理系统</title>
<link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:linear-gradient(135deg,#1e3a5f,#0f172a); min-height:100vh; display:flex; align-items:center; }
  .login-card { max-width:400px; margin:auto; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
</style>
</head>
<body>
<div class="container">
  <div class="card login-card p-4">
    <h3 class="text-center mb-4">🏋️ 健身房管理系统</h3>
    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
    <form method="post" th:action="@{/login}">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-control" required placeholder="请输入用户名">
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" name="password" class="form-control" required placeholder="请输入密码">
      </div>
      <button type="submit" class="btn btn-primary w-100">登 录</button>
    </form>
    <div class="mt-3 text-muted small">
      <p class="mb-1">测试账号（密码均为 123456）：</p>
      <p class="mb-0">admin / front01 / coach01 / member01</p>
    </div>
  </div>
</div>
</body>
</html>
