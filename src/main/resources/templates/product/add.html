<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新增商品 - 健身管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <h4>新增商品</h4>
    <div class="card p-4" style="max-width:500px">
      <form method="post" th:action="@{/product/add}">
        <div class="mb-3"><label class="form-label">商品名称 *</label><input name="name" class="form-control" required></div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label">类别</label>
            <select name="category" class="form-select"><option>补剂</option><option>服饰</option><option>周边</option></select></div>
          <div class="col-md-6 mb-3"><label class="form-label">单位</label><input name="unit" class="form-control" value="件"></div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label">进价</label><input type="number" step="0.01" name="costPrice" class="form-control" value="0"></div>
          <div class="col-md-6 mb-3"><label class="form-label">售价 *</label><input type="number" step="0.01" name="salePrice" class="form-control" required></div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label">初始库存</label><input type="number" name="stock" class="form-control" value="0"></div>
          <div class="col-md-6 mb-3"><label class="form-label">预警阈值</label><input type="number" name="warnThreshold" class="form-control" value="5"></div>
        </div>
        <button class="btn btn-primary">保存</button>
        <a th:href="@{/product/list}" class="btn btn-outline-secondary">返回</a>
      </form>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
