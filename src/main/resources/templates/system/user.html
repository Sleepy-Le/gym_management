<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>系统管理 - 健身管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .list-table-wrap { max-height:calc(100vh - 350px); overflow:auto; }
  .list-table-wrap thead { position:sticky; top:0; z-index:1; }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <h4>系统管理 - 用户权限</h4>
    <div class="card p-3">
      <div class="list-table-wrap"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>用户ID</th><th>用户名</th><th>真实姓名</th><th>角色</th><th>关联人员</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>
        <tr th:each="u : ${users}">
          <td th:text="${u.userId}"></td>
          <td th:text="${u.username}"></td>
          <td th:text="${u.realName}"></td>
          <td>
            <span th:if="${u.role == 'admin'}" class="badge bg-danger" th:text="${u.role}"></span>
            <span th:if="${u.role == 'front'}" class="badge bg-primary" th:text="${u.role}"></span>
            <span th:if="${u.role == 'coach'}" class="badge bg-success" th:text="${u.role}"></span>
            <span th:if="${u.role == 'member'}" class="badge bg-info" th:text="${u.role}"></span>
          </td>
          <td th:text="${u.refId == null ? '-' : u.refId}"></td>
          <td>
            <span th:if="${u.status == '正常'}" class="badge bg-success" th:text="${u.status}"></span>
            <span th:if="${u.status != '正常'}" class="badge bg-warning" th:text="${u.status}"></span>
          </td>
          <td>
            <a th:href="@{/system/user/toggle(id=${u.userId})}" class="btn btn-sm btn-outline-warning"
               th:text="${u.status == '正常'} ? '禁用' : '启用'"></a>
            <a th:href="@{/system/user/reset(id=${u.userId})}" class="btn btn-sm btn-outline-secondary" onclick="return confirm('重置密码为123456？')">重置密码</a>
          </td>
        </tr>
        </tbody>
      </table></div>
      <nav th:replace="~{fragments/pagination :: pager}"></nav>
    </div>
    <div class="alert alert-info mt-3 small">
      <strong>权限说明：</strong>系统管理员拥有全部权限；前台可管理会员、预约、消费；教练仅可查看自己的课表和录入训练；会员仅可查看个人信息和预约。
      菜单根据角色动态生成，对应指导书"用户权限表+动态菜单"要求。
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
