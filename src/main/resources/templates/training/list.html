<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>训练记录 - 健身管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .list-table-wrap { max-height:calc(100vh - 250px); overflow:auto; }
  .list-table-wrap thead { position:sticky; top:0; z-index:1; }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>训练记录</h4>
      <a th:if="${session.role == 'admin' or session.role == 'coach'}" th:href="@{/training/add}" class="btn btn-primary">+ 录入训练</a>
    </div>
    <div class="card p-3">
      <div class="list-table-wrap"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>记录号</th><th>日期</th><th>会员</th><th>教练</th><th>部位</th><th>总组数</th><th>时长</th><th>操作</th></tr></thead>
        <tbody>
        <tr th:each="t : ${logs}">
          <td th:text="'#' + ${t.log_id}"></td>
          <td th:text="${#dates.format(t.training_date, 'yyyy-MM-dd')}"></td>
          <td th:text="${t.mname}"></td>
          <td th:text="${t.cname == null ? '-' : t.cname}"></td>
          <td><span class="badge bg-secondary" th:text="${t.training_part}"></span></td>
          <td th:text="${t.total_sets}"></td>
          <td th:text="${t.duration} + '分钟'"></td>
          <td><a th:href="@{/training/detail(id=${t.log_id})}" class="btn btn-sm btn-outline-info">查看明细</a></td>
        </tr>
        </tbody>
      </table></div>
      <nav th:replace="~{fragments/pagination :: pager}"></nav>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
