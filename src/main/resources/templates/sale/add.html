<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新增消费 - 健身管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <h4>新增消费单</h4>
    <div class="card p-4">
      <form method="post" th:action="@{/sale/add}" id="saleForm">
        <div class="row">
          <div class="col-md-4 mb-3"><label class="form-label">会员（散客可不选）</label>
            <select name="memberId" class="form-select">
              <option value="">散客</option>
              <option th:each="m : ${members}" th:value="${m.member_id}" th:text="${m.name}"></option>
            </select></div>
          <div class="col-md-4 mb-3"><label class="form-label">支付方式 *</label>
            <select name="payMethod" class="form-select"><option>现金</option><option>微信</option><option>支付宝</option><option>刷卡</option></select></div>
          <div class="col-md-4 mb-3 d-flex align-items-end"><div class="alert alert-info w-100 mb-0 small">提交后自动扣减库存</div></div>
        </div>
        <h6>消费明细（主从表）</h6>
        <table class="table table-sm" id="itemTable">
          <thead><tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th><th>操作</th></tr></thead>
          <tbody></tbody>
          <tfoot><tr class="table-active"><td colspan="3" class="text-end"><strong>合计：</strong></td><td colspan="2"><strong id="totalAmount">¥0.00</strong></td></tr></tfoot>
        </table>
        <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addRow()">+ 添加商品</button>
        <div><button class="btn btn-primary">提交消费单</button> <a th:href="@{/sale/list}" class="btn btn-outline-secondary">返回</a></div>
      </form>
    </div>
  </div>
</div>
</div>
<script th:inline="javascript">
var products = /*[[${products}]]*/ [];
function addRow(){
  var opts = products.map(function(p){return '<option value="'+p.product_id+'" data-price="'+p.sale_price+'">'+p.name+'（库存'+p.stock+'）</option>';}).join('');
  var t = document.getElementById('itemTable').getElementsByTagName('tbody')[0];
  var r = t.insertRow();
  r.innerHTML = '<td><select name="productId" class="form-select form-select-sm" onchange="updateRow(this)">'+opts+'</select></td>' +
    '<td class="price">¥0.00</td>' +
    '<td><input name="quantity" type="number" min="1" value="1" class="form-control form-control-sm" onchange="updateRow(this)"></td>' +
    '<td class="sub">¥0.00</td>' +
    '<td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest(\'tr\').remove();calcTotal();">删除</button></td>';
  updateRow(r.querySelector('select'));
}
function updateRow(el){
  var tr = el.closest('tr');
  var sel = tr.querySelector('select');
  var opt = sel.options[sel.selectedIndex];
  var price = parseFloat(opt.dataset.price) || 0;
  var qty = parseInt(tr.querySelector('input[name="quantity"]').value) || 0;
  tr.querySelector('.price').textContent = '¥' + price.toFixed(2);
  tr.querySelector('.sub').textContent = '¥' + (price * qty).toFixed(2);
  calcTotal();
}
function calcTotal(){
  var total = 0;
  document.querySelectorAll('#itemTable tbody tr').forEach(function(tr){
    total += parseFloat(tr.querySelector('.sub').textContent.replace('¥','')) || 0;
  });
  document.getElementById('totalAmount').textContent = '¥' + total.toFixed(2);
}
addRow();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
