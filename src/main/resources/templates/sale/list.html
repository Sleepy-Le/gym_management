<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>消费管理 - 健身管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .list-table-wrap { max-height:calc(100vh - 250px); overflow:auto; }
  .list-table-wrap thead { position:sticky; top:0; z-index:1; }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>消费管理</h4>
      <a th:href="@{/sale/add}" class="btn btn-primary">+ 新增消费</a>
    </div>
    <div class="card p-3">
      <div class="list-table-wrap"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>单号</th><th>时间</th><th>会员</th><th>商品明细</th><th>总金额</th><th>支付方式</th><th>操作员</th></tr></thead>
        <tbody>
        <tr th:each="s : ${orders}">
          <td th:text="'#' + ${s.order_id}"></td>
          <td th:text="${#temporals.format(s.order_date, 'MM-dd HH:mm')}"></td>
          <td th:text="${s.mname == null ? '散客' : s.mname}"></td>
          <td class="small" th:text="${s.items}"></td>
          <td class="fw-bold text-danger" th:text="'¥' + ${#numbers.formatDecimal(s.total_amount, 1, 2)}"></td>
          <td th:text="${s.pay_method}"></td>
          <td th:text="${s.operator}"></td>
        </tr>
        </tbody>
      </table></div>
      <nav th:replace="~{fragments/pagination :: pager}"></nav>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
