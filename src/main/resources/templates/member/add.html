<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新增会员 - 健身管理系统</title>
<link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <h4>新增会员</h4>
    <div class="alert alert-success" th:if="${msg != null}" th:text="${msg}"></div>
    <div class="card p-4" style="max-width:600px">
      <form method="post" th:action="@{/member/add}">
        <div class="mb-3"><label class="form-label">姓名 *</label><input name="name" class="form-control" required></div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label">性别 *</label>
            <select name="gender" class="form-select"><option>男</option><option>女</option></select></div>
          <div class="col-md-6 mb-3"><label class="form-label">手机号 *</label><input name="phone" class="form-control" required maxlength="11"></div>
        </div>
        <div class="mb-3"><label class="form-label">生日</label><input type="date" name="birthday" class="form-control"></div>
        <div class="mb-3"><label class="form-label">地址</label><input name="address" class="form-control"></div>
        <div class="mb-3"><label class="form-label">备注（健身目标等）</label><textarea name="remark" class="form-control" rows="2"></textarea></div>
        <button class="btn btn-primary">保存</button>
        <a th:href="@{/member/list}" class="btn btn-outline-secondary">返回</a>
      </form>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
