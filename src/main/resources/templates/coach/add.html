<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新增教练 - 健身管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <h4>新增教练</h4>
    <div class="alert alert-success" th:if="${msg != null}" th:text="${msg}"></div>
    <div class="card p-4" style="max-width:500px">
      <form method="post" th:action="@{/coach/add}">
        <div class="mb-3"><label class="form-label">姓名 *</label><input name="name" class="form-control" required></div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label">性别</label><select name="gender" class="form-select"><option>男</option><option>女</option></select></div>
          <div class="col-md-6 mb-3"><label class="form-label">电话</label><input name="phone" class="form-control" required></div>
        </div>
        <div class="mb-3"><label class="form-label">专长</label><input name="specialty" class="form-control" placeholder="如：增肌/减脂/瑜伽"></div>
        <div class="mb-3"><label class="form-label">课时单价（元）</label><input type="number" step="0.01" name="hourlyRate" class="form-control" value="300"></div>
        <button class="btn btn-primary">保存</button>
        <a th:href="@{/coach/list}" class="btn btn-outline-secondary">返回</a>
      </form>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
