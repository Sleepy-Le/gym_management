<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>教练管理 - 健身管理系统</title>
<link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .list-table-wrap { max-height:calc(100vh - 250px); overflow:auto; }
  .list-table-wrap thead { position:sticky; top:0; z-index:1; }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>教练管理</h4>
      <a th:href="@{/coach/add}" class="btn btn-primary">+ 新增教练</a>
    </div>
    <div class="card p-3">
      <div class="list-table-wrap"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>编号</th><th>姓名</th><th>性别</th><th>电话</th><th>专长</th><th>课时单价</th><th>入职日期</th><th>状态</th><th>本月课时</th></tr></thead>
        <tbody>
        <tr th:each="c : ${coaches}">
          <td th:text="${c.coachId}"></td>
          <td th:text="${c.name}"></td>
          <td th:text="${c.gender}"></td>
          <td th:text="${c.phone}"></td>
          <td th:text="${c.specialty}"></td>
          <td th:text="'¥' + ${c.hourlyRate}"></td>
          <td th:text="${c.hireDate}"></td>
          <td>
            <span th:if="${c.status == '在职'}" class="badge bg-success" th:text="${c.status}"></span>
            <span th:if="${c.status != '在职'}" class="badge bg-secondary" th:text="${c.status}"></span>
          </td>
          <td th:text="${monthCountMap[c.coachId]} + ' 节'"></td>
        </tr>
        </tbody>
      </table></div>
      <nav th:replace="~{fragments/pagination :: pager}"></nav>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
