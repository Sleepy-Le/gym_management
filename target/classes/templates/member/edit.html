<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>编辑会员 - 健身管理系统</title>
<link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <h4>编辑会员 - <span th:text="${member.name}"></span></h4>
    <div class="card p-4" style="max-width:600px">
      <form method="post" th:action="@{/member/edit(id=${member.memberId})}">
        <div class="mb-3"><label class="form-label">姓名</label><input name="name" class="form-control" th:value="${member.name}" required></div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label">性别</label>
            <select name="gender" class="form-select">
              <option th:selected="${member.gender == '男'}">男</option>
              <option th:selected="${member.gender == '女'}">女</option>
            </select></div>
          <div class="col-md-6 mb-3"><label class="form-label">手机号</label><input name="phone" class="form-control" th:value="${member.phone}" required></div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label">生日</label><input type="date" name="birthday" class="form-control" th:value="${member.birthday}"></div>
          <div class="col-md-6 mb-3"><label class="form-label">状态</label>
            <select name="status" class="form-select">
              <option th:selected="${member.status == '正常'}">正常</option>
              <option th:selected="${member.status == '冻结'}">冻结</option>
              <option th:selected="${member.status == '过期'}">过期</option>
            </select></div>
        </div>
        <div class="mb-3"><label class="form-label">地址</label><input name="address" class="form-control" th:value="${member.address}"></div>
        <div class="mb-3"><label class="form-label">备注</label><textarea name="remark" class="form-control" rows="2" th:text="${member.remark}"></textarea></div>
        <button class="btn btn-primary">保存</button>
        <a th:href="@{/member/list}" class="btn btn-outline-secondary">返回</a>
      </form>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
