<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>录入训练 - 健身管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <h4>录入训练记录</h4>
    <div class="card p-4">
      <form method="post" th:action="@{/training/add}" id="trainForm">
        <div class="row">
          <div class="col-md-3 mb-3"><label class="form-label">会员 *</label>
            <select name="memberId" class="form-select" required>
              <option th:each="m : ${members}" th:value="${m.member_id}" th:text="${m.name}"></option>
            </select></div>
          <div class="col-md-3 mb-3" th:if="${role == 'admin'}"><label class="form-label">教练</label>
            <select name="coachId" class="form-select">
              <option value="">无</option>
              <option th:each="c : ${coaches}" th:value="${c.coach_id}" th:text="${c.name}"></option>
            </select></div>
          <div class="col-md-2 mb-3"><label class="form-label">日期 *</label><input type="date" name="trainingDate" class="form-control" required></div>
          <div class="col-md-2 mb-3"><label class="form-label">训练部位 *</label>
            <select name="trainingPart" class="form-select"><option>胸</option><option>背</option><option>腿</option><option>肩</option><option>臂</option><option>核心</option><option>有氧</option></select></div>
          <div class="col-md-2 mb-3"><label class="form-label">时长(分钟)</label><input type="number" name="duration" class="form-control" value="60"></div>
        </div>
        <h6 class="mt-3">训练明细（主从表）</h6>
        <table class="table table-sm" id="detailTable">
          <thead><tr><th>动作名称</th><th>重量(kg)</th><th>组数</th><th>次数</th><th>操作</th></tr></thead>
          <tbody>
            <tr>
              <td><input name="exerciseName" class="form-control form-control-sm" placeholder="如：杠铃卧推"></td>
              <td><input name="weight" type="number" step="0.5" class="form-control form-control-sm" value="0"></td>
              <td><input name="sets" type="number" class="form-control form-control-sm" value="4"></td>
              <td><input name="reps" type="number" class="form-control form-control-sm" value="10"></td>
              <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">删除</button></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addRow()">+ 添加动作</button>
        <div class="mb-3"><label class="form-label">备注</label><textarea name="remark" class="form-control" rows="2"></textarea></div>
        <button class="btn btn-primary">保存训练记录</button>
        <a th:href="@{/training/list}" class="btn btn-outline-secondary">返回</a>
      </form>
    </div>
  </div>
</div>
</div>
<script>
function addRow(){
  var t = document.getElementById('detailTable').getElementsByTagName('tbody')[0];
  var r = t.insertRow();
  r.innerHTML = '<td><input name="exerciseName" class="form-control form-control-sm"></td>' +
    '<td><input name="weight" type="number" step="0.5" class="form-control form-control-sm" value="0"></td>' +
    '<td><input name="sets" type="number" class="form-control form-control-sm" value="4"></td>' +
    '<td><input name="reps" type="number" class="form-control form-control-sm" value="10"></td>' +
    '<td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest(\'tr\').remove()">删除</button></td>';
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
