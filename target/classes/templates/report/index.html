<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>统计报表 - 健身管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .stat-card { border-left:4px solid #3b82f6; }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <h4>统计报表</h4>
    <div class="row mb-4">
      <div class="col-md-3"><div class="card stat-card p-3"><div class="text-muted small">今日营收</div><div class="fs-3 fw-bold">¥<span th:text="${#numbers.formatDecimal(todayRevenue, 1, 2)}"></span></div></div></div>
      <div class="col-md-3"><div class="card stat-card p-3" style="border-left-color:#10b981"><div class="text-muted small">本月营收（<span th:text="${monthCount}"></span>单）</div><div class="fs-3 fw-bold">¥<span th:text="${#numbers.formatDecimal(monthRevenue, 1, 2)}"></span></div></div></div>
      <div class="col-md-3"><div class="card stat-card p-3" style="border-left-color:#f59e0b"><div class="text-muted small">活跃会员</div><div class="fs-3 fw-bold" th:text="${activeMember}"></div></div></div>
      <div class="col-md-3"><div class="card stat-card p-3" style="border-left-color:#ef4444"><div class="text-muted small">本月消课</div><div class="fs-3 fw-bold" th:text="${monthClass} + ' 节'"></div></div></div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="card p-3 mb-3">
          <h6>教练课时与提成统计</h6>
          <table class="table table-sm">
            <thead><tr><th>教练</th><th>专长</th><th>本月课时</th><th>课时单价</th><th>预计提成(40%)</th></tr></thead>
            <tbody>
            <tr th:each="c : ${coachStats}">
              <td th:text="${c.name}"></td>
              <td th:text="${c.specialty}"></td>
              <td th:text="${c.cnt} + ' 节'"></td>
              <td th:text="'¥' + ${c.hourly_rate}"></td>
              <td class="text-success fw-bold" th:text="'¥' + ${#numbers.formatDecimal(c.cnt * c.hourly_rate * 0.4, 1, 2)}"></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3 mb-3">
          <h6>商品销售排行</h6>
          <table class="table table-sm">
            <thead><tr><th>排名</th><th>商品</th><th>销量</th><th>销售额</th></tr></thead>
            <tbody>
            <tr th:each="p, iter : ${topProducts}">
              <td th:text="${iter.index + 1}"></td>
              <td th:text="${p.name}"></td>
              <td th:text="${p.qty}"></td>
              <td th:text="'¥' + ${#numbers.formatDecimal(p.amt, 1, 2)}"></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="card p-3">
      <h6>近7日营收趋势</h6>
      <canvas id="revenueChart" height="100"></canvas>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
var labels = /*[[${chartLabels}]]*/ [];
var data = /*[[${chartData}]]*/ [];
new Chart(document.getElementById('revenueChart'), {
  type: 'line',
  data: {
    labels: labels.map(function(d){return d.substring(5);}),
    datasets: [{label:'营收(元)', data: data.map(function(v){return Number(v);}),
      borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,.1)', fill:true, tension:.3}]
  },
  options: {plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
