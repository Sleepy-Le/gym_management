<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>商品库存 - 健身管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f5f7fa; }
  .sidebar { min-height:100vh; background:#1e293b; padding-top:20px; }
  .sidebar a { color:#cbd5e1; display:block; padding:10px 20px; text-decoration:none; border-left:3px solid transparent; }
  .sidebar a:hover, .sidebar a.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
  .sidebar .brand { color:#fff; font-size:18px; font-weight:bold; padding:0 20px 20px; border-bottom:1px solid #334155; margin-bottom:10px; }
  .content { padding:20px; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .list-table-wrap { max-height:calc(100vh - 250px); overflow:auto; }
  .list-table-wrap thead { position:sticky; top:0; z-index:1; }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">
  <div class="col-md-2 sidebar p-0" th:replace="~{fragments/nav :: nav}"></div>
  <div class="col-md-10 content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>商品库存</h4>
      <a th:href="@{/product/add}" class="btn btn-primary">+ 新增商品</a>
    </div>
    <div class="card p-3">
      <div class="list-table-wrap"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>编号</th><th>商品名</th><th>类别</th><th>进价</th><th>售价</th><th>库存</th><th>预警阈值</th><th>状态</th></tr></thead>
        <tbody>
        <tr th:each="p : ${products}" th:classappend="${p.stock <= p.warnThreshold} ? 'table-warning'">
          <td th:text="${p.productId}"></td>
          <td th:text="${p.name}"></td>
          <td th:text="${p.category}"></td>
          <td th:text="'¥' + ${p.costPrice}"></td>
          <td th:text="'¥' + ${p.salePrice}"></td>
          <td th:classappend="${p.stock <= p.warnThreshold} ? 'text-danger fw-bold'" th:text="${p.stock} + ' ' + ${p.unit}"></td>
          <td th:text="${p.warnThreshold}"></td>
          <td>
            <span th:if="${p.stock <= p.warnThreshold}" class="badge bg-danger">库存不足</span>
            <span th:if="${p.stock > p.warnThreshold}" class="badge bg-success">正常</span>
          </td>
        </tr>
        </tbody>
      </table></div>
      <nav th:replace="~{fragments/pagination :: pager}"></nav>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
